 <style>
 .title{font:700 32px 'Segoe UI',Arial,sans-serif;fill:#fff}.subtitle{font:400 15px 'Segoe UI',Arial,sans-serif;fill:#a9c5dd}
 .section{font:700 18px 'Segoe UI',Arial,sans-serif;fill:#eef7ff}.label{font:600 15px 'Segoe UI',Arial,sans-serif;fill:#fff}.small{font:400 12px 'Segoe UI',Arial,sans-serif;fill:#c1d5e6}.tiny{font:400 11px 'Segoe UI',Arial,sans-serif;fill:#a8c4d9}
 .node{fill:#143858;stroke:#2c6793;stroke-width:1.4}.azureNode{fill:#103d64;stroke:#248fe0;stroke-width:1.6}.tealNode{fill:#103e48;stroke:#21b7a7;stroke-width:1.5}.orangeNode{fill:#49391e;stroke:#e3a43c;stroke-width:1.5}
 .edge{stroke:#67c6ff;stroke-width:2.3;fill:none;marker-end:url(#arrow)}.dash{stroke-dasharray:7 6}
 </style>
</defs>
